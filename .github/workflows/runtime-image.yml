name: Runtime image

on:
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codefly-dev/service-vault-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: '{{defaultContext}}'
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Verify public image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm "${IMAGE}@${{ steps.build.outputs.digest }}" version | grep -F 'Vault v2.0.3'
          test "$(docker image inspect "${IMAGE}@${{ steps.build.outputs.digest }}" --format '{{.Config.User}}')" = vault

      - name: Audit image and generate SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p evidence
          status=0
          for arch in amd64 arm64; do
            docker run --rm --network bridge -v "$PWD/evidence:/evidence" \
              aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --quiet --platform "linux/$arch" --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "/evidence/audit-$arch.json" "${IMAGE}@${DIGEST}" || status=1
            docker run --rm --network bridge -v "$PWD/evidence:/evidence" \
              aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
              image --quiet --platform "linux/$arch" --format cyclonedx \
              --output "/evidence/sbom-$arch.cdx.json" "${IMAGE}@${DIGEST}" || status=1
          done
          printf '%s\n' "${IMAGE}@${DIGEST}" > evidence/image.txt
          exit "$status"

      - name: Upload audit and SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-runtime-evidence
          path: evidence/
          if-no-files-found: error
