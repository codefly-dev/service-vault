name: Runtime image

on:
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/codefly-dev/service-vault-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: '{{defaultContext}}'
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Verify public image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Audit image
        run: >-
          docker run --rm --network bridge
          aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --quiet --severity HIGH,CRITICAL --exit-code 1
          "${IMAGE}@${{ steps.build.outputs.digest }}"
